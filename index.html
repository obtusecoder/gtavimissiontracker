/* Layout: a single scrolling run-sheet — progress header with tabs, then chapter "reels" of mission rows */
:root{
  --bg:#f6f2f4; --surface:#ffffff; --ink:#1d1a22; --muted:#6c6474; --line:#e4dbe2;
  --pink:#e0357a; --sun:#c96a1f; --teal:#0f8f8a; --done:#9a93a0; --track:#ece4ea;
  --plat:#5b7fa8; --gold:#b8891a; --silver:#8a8f98; --bronze:#a7623a;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1e1825; --ink:#f3edf5; --muted:#a79cb0; --line:#2f2638;
  --pink:#ff5c9b; --sun:#ffa25c; --teal:#3cc7bf; --done:#6d6375; --track:#2b2333;
  --plat:#9cc3ef; --gold:#f2c14e; --silver:#c3c8d0; --bronze:#e0956a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1e1825; --ink:#f3edf5; --muted:#a79cb0; --line:#2f2638;
  --pink:#ff5c9b; --sun:#ffa25c; --teal:#3cc7bf; --done:#6d6375; --track:#2b2333;
  --plat:#9cc3ef; --gold:#f2c14e; --silver:#c3c8d0; --bronze:#e0956a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:16px 12px;display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top-right{display:flex;gap:10px;align-items:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);letter-spacing:.01em;line-height:1;margin:0;text-transform:uppercase}
h1 .home{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit;line-height:inherit;text-align:left}
h1 span{background:linear-gradient(90deg,var(--sun),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.status{font-family:var(--mono);font-size:12px;color:var(--muted)}
.btn{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.small{font-size:12px;padding:3px 9px}
.btn[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.panel .seg{width:fit-content}
.plat{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.view-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:-12px}
.tabs button{font:inherit;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pink)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.bars{grid-template-columns:1fr}}
.bar-label{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:5px}
.bar-label b{font-family:var(--mono);color:var(--ink);font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}
.track{height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--sun),var(--pink));transition:width .35s ease}
.fill.teal{background:var(--teal)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#missionsView{display:grid;gap:18px}
main .wrap,#missionsView,#list,.xwrap{grid-template-columns:minmax(0,1fr)}
section{min-width:0}
#warnings:empty{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.controls label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=search],textarea,input[type=number]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=search]{flex:1;min-width:140px}
main .wrap{display:grid;gap:22px}
main .wrap.body{padding-block:18px 48px}
.note{border:1px solid var(--sun);border-left-width:4px;border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.45;background:var(--surface)}
.note b{color:var(--sun)}
.note .checked{display:block;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--muted)}
/* settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:18px}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin:0}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.switches{display:grid;gap:10px}
.sw{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;cursor:pointer}
.sw input{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--track);border:1px solid var(--line);position:relative;margin:2px 0 0;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw input:checked{background:var(--pink);border-color:var(--pink)}
.sw input:checked::after{transform:translateX(16px);background:#fff}
.sw b{display:block;font-size:14px}
.sw small{display:block;color:var(--muted);font-size:13px}
.backup{display:grid;gap:8px}
.backup textarea{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:12px;min-height:64px;resize:vertical}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--pink)}
/* warnings */
.warn{border:1px solid var(--pink);border-left-width:4px;border-radius:8px;padding:10px 14px;background:var(--surface);display:grid;gap:6px}
.warn h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--pink)}
.warn ul{border:0;border-radius:0;background:none;display:grid;gap:4px}
.warn li{border:0;font-size:14px}
.linkish{font:inherit;font-weight:700;color:var(--ink);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
/* chapters + rows */
section{display:grid;gap:8px}
.chap-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer;user-select:none;border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;width:100%}
.chap-no{font-family:var(--display);font-size:30px;line-height:1;color:var(--pink);min-width:2ch}
.chap-title{min-width:0}
.chap-h{margin:0;font:inherit}
.chap-title .ct{display:block;font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.1;text-wrap:balance}
.chap-title .ct.secret{color:var(--muted)}
.chap-title .mini{display:block;margin-top:6px;height:5px;background:var(--track);border-radius:3px;overflow:hidden}
.chap-title .mini span{display:block;height:100%;background:var(--pink);transition:width .35s ease}
.chap-count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.caret{transition:transform .2s}
section.closed .caret{transform:rotate(-90deg)}
section.closed ul{display:none}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{border-top:1px solid var(--line)}
li:first-child{border-top:0}
.row{display:grid;grid-template-columns:22px 1fr auto auto;gap:12px;align-items:center;padding:10px 14px}
.row:hover{background:var(--bg)}
.row label{cursor:pointer;min-width:0}
li.flash .row{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--pink) 18%,transparent)}100%{background:transparent}}
input[type=checkbox]:not(.swc){appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;margin:0;display:grid;place-items:center;cursor:pointer;background:transparent}
input[type=checkbox]:not(.swc):checked{background:var(--pink);border-color:var(--pink)}
input[type=checkbox]:not(.swc):checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.m-name{font-weight:600;display:block}
.m-sub{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.m-mine{display:block;font-weight:500;font-size:13px;color:var(--teal);white-space:pre-wrap;overflow-wrap:anywhere}
.m-mine::before{content:"Note: ";font-weight:700}
li.is-done .m-name{color:var(--done);text-decoration:line-through;text-decoration-thickness:1.5px}
li.secret .m-name{color:var(--muted);font-style:italic;font-weight:500}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.opt{color:var(--teal);border-color:var(--teal)}
.tag.miss{color:var(--sun);border-color:var(--sun)}
.tag.sf{color:var(--pink);border-color:var(--pink)}
.tag.g-X{color:var(--teal);border-color:var(--teal)}.tag.g-M{color:var(--plat);border-color:var(--plat)}
.tag.g-P{color:var(--plat);border-color:var(--plat)}.tag.g-G{color:var(--gold);border-color:var(--gold)}.tag.g-S{color:var(--silver);border-color:var(--silver)}.tag.g-B{color:var(--bronze);border-color:var(--bronze)}
.nb{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:none;border:1px solid transparent;border-radius:6px;padding:3px 7px;cursor:pointer}
.nb:hover{border-color:var(--line);color:var(--ink)}
.editor{display:grid;gap:8px;padding:0 14px 12px 48px}
.editor textarea{width:100%;box-sizing:border-box;min-height:60px;resize:vertical}
.hidden-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;color:var(--muted);font-size:14px}
.empty{padding:14px;color:var(--muted);font-size:14px}
/* collectibles */
.ctr{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 14px}
.ctr .m-name{font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{font:inherit;font-weight:700;width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.stepper input{width:64px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding:5px 6px}
.stepper .of{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:4.5ch;font-variant-numeric:tabular-nums}
li.full .m-name{color:var(--teal)}
.group-hint{font-size:13px;color:var(--muted);margin:0}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:520px){
  header{position:static}
  .row{grid-template-columns:22px 1fr auto}
  .row .tags{grid-column:2;grid-row:2;justify-content:flex-start}
  .row .nb{grid-column:3;grid-row:1}
  .editor{padding-left:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function blank(){return{v:2,done:{},notes:{},trophies:{},col:{}};}
function normalize(s){
  var o=blank();if(!s||typeof s!=="object")return o;
  ["done","notes","trophies","col"].forEach(function(k){if(s[k]&&typeof s[k]==="object")o[k]=s[k];});
  // v1 used positional ids like "c3-12"; move them to name-based ids
  Object.keys(o.done).forEach(function(k){if(LEGACY[k]){o.done[LEGACY[k]]=1;delete o.done[k];}});
  Object.keys(o.notes).forEach(function(k){if(LEGACY[k]){o.notes[LEGACY[k]]=o.notes[k];delete o.notes[k];}});
  Object.keys(o.trophies).forEach(function(k){if(LEGACY[k]){o.trophies[LEGACY[k]]=1;delete o.trophies[k];}});
  return o;
}
function hasProgress(s){return Object.keys(s.done).length||Object.keys(s.notes).length||Object.keys(s.trophies).length||Object.keys(s.col).some(function(k){return s.col[k]>0;});}

// Revealed: everything up to your furthest ticked mission, plus up to and including the next story mission.
var FAR=-1;
function limit(){
  var far=-1;ORDER.forEach(function(m){if(state.done[m.id])far=m.idx;});FAR=far;
  var lim=far;for(var i=far+1;i<ORDER.length;i++){lim=i;if(ORDER[i].kind==="m")break;}
  return lim;
}
var LIM=0;
function chReached(cid){return !set.spoilers||CHMAP[cid].ms[0].idx<=LIM;}
function revealed(m){
  if(!set.spoilers||state.done[m.id]||peek[m.id]||peekCh[m.ch])return true;
  if(m.idx!==undefined)return m.idx<=LIM;
  // Side questlines show once you've completed the first mission of the chapter they open in
  return CHMAP[m.start].ms[0].idx<=FAR;
}
function chFinished(cid){var st=CHMAP[cid].ms.filter(function(m){return m.kind==="m";});return st.length&&state.done[st[st.length-1].id];}

function passes(m){
  if(ui.filter==="story"&&m.kind!=="m")return false;
  if(ui.filter==="side"&&m.kind==="m")return false;
  if(set.character&&ui.who!=="all"&&m.who!==ui.who&&m.who!=="Both")return false;
  if(ui.hideDone&&state.done[m.id])return false;
  return true;
}

function renderList(){
  LIM=limit();

    var reached=c.id==="sf"||chReached(c.id)||peekCh[c.id];

    if(c.id==="sf"&&set.spoilers&&!c.ms.some(revealed))return;
    var title=c.id==="sf"&&set.spoilers?"More side missions":c.title;
    var shown=[], hiddenN=0, firstHidden=null;
    c.ms.forEach(function(m){
      if(!passes(m))return;
      if(revealed(m)){if(!q||norm(m.name+" "+m.note).indexOf(q)>=0)shown.push(m);}
      else if(!q){hiddenN++;if(!firstHidden)firstHidden=m;}
    });
    var filtering=q||ui.hideDone||ui.filter!=="all"||(set.character&&ui.who!=="all");
    if(!shown.length&&(q||(filtering&&!hiddenN)))return;
    var d=c.ms.filter(function(m){return state.done[m.id];}).length, n=c.ms.length;
    var shut=ui.closed[c.id]&&!q;

      '<span class="chap-no">'+c.no+'</span><span class="chap-title"><span class="ct'+(reached?"":" secret")+'">'+(reached?esc(title):"Chapter "+c.no+" · not reached yet")+'</span><span class="mini"><span style="width:'+(n?d/n*100:0)+'%"></span></span></span>'+
      '<span class="chap-count">'+d+'/'+n+' <span class="caret" aria-hidden="true">▾</span></span></button></h2><ul>';

    if(!shown.length&&!hiddenN)html+='<li class="empty">Nothing to show here.</li>';
    html+='</ul></section>';
  });
  $("list").innerHTML=html||'<p class="empty">No missions match.</p>';
}

    var on=!!state.trophies[t.id], show=!set.spoilers||!t.hid||on||peekTr[t.id];
    h+='<li class="'+(on?"is-done":"")+(show?"":" secret")+'"><div class="row"><input type="checkbox" id="cb-'+t.id+'" data-tr="'+t.id+'"'+(on?" checked":"")+'>'+
      '<label for="cb-'+t.id+'"><span class="m-name">'+(show?esc(t.name):(XB()?"Hidden achievement":"Hidden trophy"))+'</span><span class="m-sub">'+(show?esc(T(t.how)):"Hidden to avoid spoilers")+'</span></label>'+
      '<span class="tags">'+(XB()?(t.gs?'<span class="tag g-X">'+t.gs+'G</span>':'<span class="tag g-M">Mythic</span>'):'<span class="tag g-'+t.g+'">'+GRADE[t.g]+'</span>')+'</span>'+(show?"<span></span>":'<button class="nb" data-peektr="'+t.id+'">Show</button>')+'</div></li>';
  });
  h+='</ul></section>';
  COL.forEach(function(g,gi){
    var sum=0,tot=0;g.items.forEach(function(it){sum+=Math.min(state.col[it[0]]||0,it[2]);tot+=it[2];});
    h+='<section><h2 class="chap-h"><span class="chap-head" style="cursor:default"><span class="chap-no">'+(gi+1)+'</span><span class="chap-title"><span class="ct">'+esc(g.t)+'</span><span class="mini"><span style="width:'+(tot?sum/tot*100:0)+'%"></span></span></span><span class="chap-count">'+sum+'/'+tot+'</span></span></h2>'+
      '<p class="group-hint">'+esc(T(g.hint))+'</p><ul>';
    g.items.forEach(function(it){
      var v=state.col[it[0]]||0;
      h+='<li class="'+(v>=it[2]?"full":"")+'"><div class="ctr"><label for="n-'+it[0]+'" class="m-name">'+esc(it[1])+'</label>'+
        '<span class="stepper"><button data-step="'+it[0]+'" data-d="-1" aria-label="One fewer '+esc(it[1])+'">−</button><input type="number" id="n-'+it[0]+'"'+PM+' data-col="'+it[0]+'" min="0" max="'+it[2]+'" value="'+v+'" inputmode="numeric"><button data-step="'+it[0]+'" data-d="1" aria-label="One more '+esc(it[1])+'">+</button><span class="of">/'+it[2]+'</span></span></div></li>';
    });
    h+='</ul></section>';
  });
  $("extrasView").innerHTML='<div class="xwrap" style="display:grid;gap:22px">'+h+'</div>';
}

// ---------- SETTINGS, BACKUP ----------
function renderSettings(){
  var p=$("optionsView");
  if(view()!=="options"){p.innerHTML="";return;}
  var opts=[["spoilers","Spoiler-free mode","Hide mission names, chapter names, side missions and hidden trophies until you reach them."],
    ["missables","Missable warnings","Show a reminder of missable missions before you can lose them."],
    ["notes","Mission notes","Add your own note to any mission."],
    ["character","Jason / Lucia filter","Show the character filter above the mission list."],
    ["extras","Trophies & Collectibles tab","Track trophies and collectible counts."]];
  p.innerHTML='<div class="view-head"><h2>Settings</h2><button class="btn" id="doneBtn">Back to tracker</button></div>'+
    '<div><h3>Appearance</h3><div class="seg" role="group" aria-label="Theme"><button data-theme-set="dark" aria-pressed="'+(set.theme!=="light")+'">Dark</button><button data-theme-set="light" aria-pressed="'+(set.theme==="light")+'">Light</button></div></div>'+
    '<div><h3>Features</h3><div class="switches">'+opts.map(function(o){
    return '<label class="sw"><input type="checkbox" class="swc" role="switch" id="set-'+o[0]+'" data-set="'+o[0]+'"'+(set[o[0]]?" checked":"")+'><span><b>'+o[1]+'</b><small>'+o[2]+'</small></span></label>';}).join("")+
    '</div><p class="msg">These settings are saved in this browser.</p></div>'+
    '<div class="backup"><h3>Backup &amp; restore</h3><p class="msg" style="margin:0">Copy your backup code to keep your progress safe or move it to another device or browser. It includes ticks, notes, trophies and collectibles.</p>'+
    '<div class="row-btns"><button class="btn" id="mkBackup">Create backup code</button><button class="btn" id="cpBackup" hidden>Copy code</button><span class="msg" id="bkMsg" aria-live="polite"></span></div>'+
    '<textarea id="bkOut"'+PM+' readonly hidden aria-label="Your backup code"></textarea>'+
    '<label for="bkIn" class="msg">Paste a backup code to restore:</label><textarea id="bkIn"'+PM+' placeholder="GTA6:…"></textarea>'+
    '<div class="row-btns"><button class="btn" id="restore">Restore</button><span id="rsConfirm" hidden><button class="btn primary small" id="rsYes">Replace my progress</button> <button class="btn small" id="rsNo">Cancel</button></span><span class="msg" id="rsMsg" aria-live="polite"></span></div></div>'+
    '<div class="backup"><h3>Reset</h3><div class="row-btns"><button class="btn" id="reset">Reset all progress</button><span id="resetConfirm" hidden><button class="btn primary small" id="resetYes">Yes, clear everything</button> <button class="btn small" id="resetNo">Cancel</button></span></div></div>';
}
function encode(){
  var p={v:2,d:Object.keys(state.done),n:state.notes,t:Object.keys(state.trophies),c:state.col};
  return "GTA6:"+btoa(unescape(encodeURIComponent(JSON.stringify(p))));
}
function decode(code){
  code=String(code).trim().replace(/\s+/g,"");if(code.indexOf("GTA6:")===0)code=code.slice(5);
  var p=JSON.parse(decodeURIComponent(escape(atob(code))));
  if(!p||!Array.isArray(p.d))throw new Error("bad");
  var s={done:{},notes:p.n||{},trophies:{},col:{}};
  p.d.forEach(function(k){s.done[k]=1;});(p.t||[]).forEach(function(k){s.trophies[k]=1;});
  Object.keys(p.c||{}).forEach(function(k){var v=parseInt(p.c[k],10);if(v>0)s.col[k]=v;});
  return normalize(s);
}
var pendingRestore=null;

// ---------- RENDER + SAVE ----------
function renderAll(){renderTabs();renderBars();renderControls();renderWarnings();renderList();renderExtras();renderSettings();setStatus(statusText);}
function setStatus(t){statusText=t;$("status").textContent=t;}
function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var head='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  var statics=["title",'meta[name="claude:viewport-fit-sides"]','link[rel="stylesheet"]',"style"].map(function(sel){
    return Array.prototype.map.call(document.querySelectorAll(sel),function(e){return e.closest("head")?"":e.outerHTML;}).join("");}).join("\n");
  return head+statics+'\n<div id="app"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="main">'+$("main").textContent+'<\/script></body></html>';
}
function persist(){
  lsSet(LS,state);
  if(!pub){setStatus("Saved in this browser");return;}
  setStatus("Saving…");
  clearTimeout(pubTimer);
  pubTimer=setTimeout(function(){
    try{sessionStorage.setItem("gta6-view",view());}catch(err){}
    pub.publish(buildDoc()).then(function(){setStatus("Saved");}).catch(function(e){
      var c=e&&e.code;
      if(c==="conflict")setStatus("Updated elsewhere, reloading");
      else if(c==="not_granted"||c==="not_writer"){pub=null;setStatus("View only · saved in this browser");}
      else setStatus("Couldn't save to the page · kept in this browser");
    });
  },1800);
}
function keepFocus(fn){
  var a=document.activeElement,id=a&&a.id;fn();
  if(id&&document.activeElement!==a){var n=document.getElementById(id);if(n&&n.focus)n.focus({preventScroll:true});}
}
function changed(){renderBars();renderWarnings();renderList();renderExtras();persist();}

// ---------- EVENTS ----------
document.addEventListener("change",function(e){
  var t=e.target,d=t.dataset||{};
  if(d.id){if(t.checked)state.done[d.id]=1;else delete state.done[d.id];keepFocus(changed);}
  else if(d.tr){if(t.checked)state.trophies[d.tr]=1;else delete state.trophies[d.tr];keepFocus(function(){renderBars();renderExtras();});persist();}
  else if(d.col){var it=null;COL.forEach(function(g){g.items.forEach(function(x){if(x[0]===d.col)it=x;});});
    var v=Math.max(0,Math.min(it[2],parseInt(t.value,10)||0));if(v)state.col[d.col]=v;else delete state.col[d.col];keepFocus(function(){renderBars();renderExtras();});persist();}
  else if(d.set){set[d.set]=t.checked;saveSet();if(d.set==="spoilers"){peek={};peekCh={};peekTr={};}renderAll();}
  else if(t.id==="hideDone"){ui.hideDone=t.checked;saveUI();keepFocus(renderList);}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){ui.qRaw=t.value;ui.q=norm(t.value).trim();renderList();}
  else if(t.id&&t.id.indexOf("ed-")===0)ui.draft=t.value;
});
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(b.id==="home"){try{history.replaceState(null,"",location.pathname+location.search);}catch(err){}location.reload();return;}
  if(b.id==="setBtn"){go(view()==="options"?"missions":"options");return;}
  if(b.id==="doneBtn"){go("missions");return;}
  if(d.plat){set.platform=d.plat;saveSet();renderTabs();renderBars();renderExtras();return;}
  if(d.themeSet){set.theme=d.themeSet;saveSet();applyTheme();renderSettings();return;}
  if(d.tab){go(d.tab);return;}
  if(d.f){ui.filter=d.f;saveUI();renderControls();renderList();return;}
  if(d.w){ui.who=d.w;saveUI();renderControls();renderList();return;}
  if(d.c){ui.closed[d.c]=!ui.closed[d.c];saveUI();b.closest("section").classList.toggle("closed",!!ui.closed[d.c]);b.setAttribute("aria-expanded",!ui.closed[d.c]);return;}
  if(d.peek){peek[d.peek]=1;renderList();renderWarnings();return;}
  if(d.peekch){peekCh[d.peekch]=1;renderList();renderWarnings();return;}
  if(d.peektr){peekTr[d.peektr]=1;renderExtras();return;}
  if(d.note){ui.editing=ui.editing===d.note?null:d.note;ui.draft=null;renderList();var ta=$("ed-"+d.note);if(ta)ta.focus();return;}
  if(d.cancel){ui.editing=null;ui.draft=null;renderList();return;}
  if(d.save){var v=$("ed-"+d.save).value.trim();if(v)state.notes[d.save]=v;else delete state.notes[d.save];ui.editing=null;ui.draft=null;renderList();persist();return;}
  if(d.del){delete state.notes[d.del];ui.editing=null;ui.draft=null;renderList();persist();return;}
  if(d.step){var it=null;COL.forEach(function(g){g.items.forEach(function(x){if(x[0]===d.step)it=x;});});
    var v2=Math.max(0,Math.min(it[2],(state.col[d.step]||0)+parseInt(d.d,10)));if(v2)state.col[d.step]=v2;else delete state.col[d.step];
    renderBars();renderExtras();persist();var inp=$("n-"+d.step);if(inp)inp.closest(".stepper").querySelector('[data-d="'+d.d+'"]').focus();return;}
  if(d.jump){var m=BYID[d.jump];if(view()!=="missions"){go("missions");}ui.closed[m.ch]=false;ui.filter="all";ui.who="all";ui.hideDone=false;ui.q="";ui.qRaw="";renderControls();renderList();
    var r=$("row-"+d.jump);if(r){r.scrollIntoView({block:"center",behavior:"smooth"});r.classList.add("flash");setTimeout(function(){r.classList.remove("flash");},1700);}return;}
  if(b.id==="mkBackup"){var o=$("bkOut");o.value=encode();o.hidden=false;$("cpBackup").hidden=false;o.select();$("bkMsg").textContent="Code created.";return;}
  if(b.id==="cpBackup"){var out=$("bkOut");
    try{navigator.clipboard.writeText(out.value).then(function(){$("bkMsg").textContent="Copied to clipboard.";},function(){out.select();$("bkMsg").textContent="Code selected. Press Ctrl+C (or Cmd+C) to copy.";});}
    catch(err){out.select();$("bkMsg").textContent="Code selected. Press Ctrl+C (or Cmd+C) to copy.";}return;}
  if(b.id==="restore"){var msg=$("rsMsg");msg.className="msg";
    try{pendingRestore=decode($("bkIn").value);}catch(err){pendingRestore=null;msg.className="msg err";msg.textContent="That code isn't valid. Check you copied all of it.";return;}
    var n=Object.keys(pendingRestore.done).length;msg.textContent="Backup has "+n+" mission"+(n===1?"":"s")+" ticked.";$("rsConfirm").hidden=false;return;}
  if(b.id==="rsYes"){state=pendingRestore||state;pendingRestore=null;peek={};peekCh={};peekTr={};$("rsConfirm").hidden=true;$("bkIn").value="";renderAll();$("rsMsg").textContent="Progress restored.";persist();return;}
  if(b.id==="rsNo"){pendingRestore=null;$("rsConfirm").hidden=true;$("rsMsg").textContent="";return;}
  if(b.id==="reset"){$("resetConfirm").hidden=false;return;}
  if(b.id==="resetNo"){$("resetConfirm").hidden=true;return;}
  if(b.id==="resetYes"){state=blank();peek={};peekCh={};peekTr={};ui.editing=null;renderAll();persist();return;}
});

// ---------- START ----------
// In Claude the page itself is the record; elsewhere (or view-only) progress lives in this browser.
function loadLocal(){
  if(!hasProgress(state)){var l=lsGet(LS);if(l){state=normalize(l);renderAll();}}
  setStatus(hasProgress(state)?"Saved in this browser":"Tick a mission to start");
}
try{var sv=sessionStorage.getItem("gta6-view");sessionStorage.removeItem("gta6-view");if(sv&&sv!=="missions"&&!location.hash)location.replace("#"+sv);}catch(err){}
// 1. keep several open tabs in step (outside Claude, where progress lives in this browser)
window.addEventListener("storage",function(e){
  if(pub)return;
  if(e.key===LS){state=normalize(lsGet(LS));renderAll();}
  else if(e.key===LSSET){set=Object.assign({},DEF,lsGet(LSSET)||{});applyTheme();renderAll();}
});
window.addEventListener("hashchange",function(){ui.editing=null;ui.draft=null;renderAll();window.scrollTo(0,0);});
renderAll();
if(window.claude&&window.claude.use){
  setStatus("Connecting…");
  window.claude.use("artifact").then(function(a){
    pub=a;
    if(!a)loadLocal();else setStatus(hasProgress(state)?"Saved":"Tick a mission to start");
  }).catch(loadLocal);
}else loadLocal();
})();
</script>
