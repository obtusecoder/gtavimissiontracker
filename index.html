<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>GTA VI Mission Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a single scrolling run-sheet — sticky progress header, then chapter "reels" of mission rows */
:root{
  --bg:#f6f2f4; --surface:#ffffff; --ink:#1d1a22; --muted:#6c6474; --line:#e4dbe2;
  --pink:#e0357a; --sun:#f08a3c; --teal:#0f8f8a; --done:#9a93a0; --track:#ece4ea;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1e1825; --ink:#f3edf5; --muted:#a79cb0; --line:#2f2638;
  --pink:#ff5c9b; --sun:#ffa25c; --teal:#3cc7bf; --done:#6d6375; --track:#2b2333; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1e1825; --ink:#f3edf5; --muted:#a79cb0; --line:#2f2638;
  --pink:#ff5c9b; --sun:#ffa25c; --teal:#3cc7bf; --done:#6d6375; --track:#2b2333; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:16px 14px;display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);letter-spacing:.01em;line-height:1;margin:0;text-transform:uppercase}
h1 span{background:linear-gradient(90deg,var(--sun),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.status{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.bars{grid-template-columns:1fr}}
.bar-label{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:5px}
.bar-label b{font-family:var(--mono);color:var(--ink);font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}
.track{height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--sun),var(--pink));transition:width .35s ease}
.fill.teal{background:var(--teal)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.controls label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);flex:1;min-width:140px}
main .wrap{padding-block:18px 48px;display:grid;gap:22px}
section{display:grid;gap:8px}
.chap-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer;user-select:none;border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0}
.chap-no{font-family:var(--display);font-size:30px;line-height:1;color:var(--pink);min-width:2ch}
.chap-title{min-width:0}
.chap-title h2{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.1;text-wrap:balance}
.chap-title .mini{margin-top:6px;height:5px;background:var(--track);border-radius:3px;overflow:hidden}
.chap-title .mini div{height:100%;background:var(--pink);transition:width .35s ease}
.chap-count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.caret{transition:transform .2s}
section.closed .caret{transform:rotate(-90deg)}
section.closed ul{display:none}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{border-top:1px solid var(--line)}
li:first-child{border-top:0}
li label{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
li label:hover{background:var(--bg)}
input[type=checkbox]{appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;margin:0;display:grid;place-items:center;cursor:pointer;background:transparent}
input[type=checkbox]:checked{background:var(--pink);border-color:var(--pink)}
input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.m-name{font-weight:600;min-width:0}
.m-note{display:block;font-weight:400;font-size:13px;color:var(--muted)}
li.is-done .m-name{color:var(--done);text-decoration:line-through;text-decoration-thickness:1.5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.opt{color:var(--teal);border-color:var(--teal)}
.tag.miss{color:var(--sun);border-color:var(--sun)}
.tag.sf{color:var(--pink);border-color:var(--pink)}
main .wrap.notewrap{padding-block:16px 0}
.note{border:1px solid var(--sun);border-left-width:4px;border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.45;background:var(--surface)}
.note b{color:var(--sun)}
.note .checked{display:block;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.empty{padding:14px;color:var(--muted);font-size:14px}
footer{font-size:12px;color:var(--muted);text-align:center}
.reset{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
@media (max-width:520px){li label{grid-template-columns:22px 1fr}.tags{grid-column:2;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function isStory(m){return m.kind==="m";}
function visible(m){
  if(ui.filter==="story"&&!isStory(m))return false;
  if(ui.filter==="side"&&isStory(m))return false;
  if(ui.hideDone&&state.done[m.id])return false;
  if(ui.q&&(m.name+" "+m.note).toLowerCase().indexOf(ui.q)<0)return false;
  return true;
}
function tags(m){
  var t="";

  if(m.kind==="s")t+='<span class="tag sf">Side</span>';
  if(m.who&&m.who!=="Both")t+='<span class="tag">'+m.who+'</span>';
  return t;
}
function render(){

        '<span class="m-name">'+esc(m.name)+(m.note?'<span class="m-note">'+esc(m.note)+'</span>':"")+'</span><span class="tags">'+tags(m)+'</span></label></li>';
    });

  });

}
function bars(){
  var all=0,ad=0,st=0,sd=0;

  set("story",sd,st);set("all",ad,all);

  document.getElementById("hideDone").checked=ui.hideDone;
  document.getElementById("status").textContent=statusText;
}
function setStatus(t){statusText=t;document.getElementById("status").textContent=t;}

function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,"\\u003c");

    var els=document.querySelectorAll(sel);return Array.prototype.map.call(els,function(e){return e.closest("head")?"":e.outerHTML;}).join("");}).join("\n");
  return head+statics+'\n<div id="app"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="main">'+document.getElementById("main").textContent+'<\/script></body></html>';
}
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  if(!self){setStatus("Saved in this browser");return;}
  setStatus("Saving…");
  clearTimeout(pubTimer);
  pubTimer=setTimeout(function(){
    self.publish(buildDoc()).then(function(){setStatus("Saved");}).catch(function(e){
      var c=e&&e.code;
      if(c==="conflict")setStatus("Updated elsewhere, reloading");
      else if(c==="not_granted"||c==="not_writer"){self=null;setStatus("View only · ticks saved in this browser");}
      else setStatus("Couldn't save to the page · kept in this browser");
    });
  },1800);
}

list.addEventListener("change",function(e){
  var id=e.target.dataset&&e.target.dataset.id;if(!id)return;
  if(e.target.checked)state.done[id]=1;else delete state.done[id];
  var li=e.target.closest("li");if(li)li.classList.toggle("is-done",e.target.checked);
  if(ui.hideDone)render();else{
    var sec=e.target.closest("section"),c=CH.filter(function(x){return x.id===sec.querySelector(".chap-head").dataset.c;})[0];
    var d=c.ms.filter(function(m){return state.done[m.id];}).length;
    sec.querySelector(".chap-count").firstChild.textContent=d+"/"+c.ms.length+" ";
    sec.querySelector(".mini div").style.width=(d/c.ms.length*100)+"%";
    bars();
  }
  persist();
});
list.addEventListener("click",function(e){
  var h=e.target.closest(".chap-head");if(!h)return;
  var id=h.dataset.c;ui.closed[id]=!ui.closed[id];saveUI();
  h.parentNode.classList.toggle("closed",!!ui.closed[id]);h.setAttribute("aria-expanded",!ui.closed[id]);
});
document.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){ui.filter=b.dataset.f;saveUI();render();});});
document.getElementById("hideDone").addEventListener("change",function(e){ui.hideDone=e.target.checked;saveUI();render();});
document.getElementById("q").addEventListener("input",function(e){ui.q=e.target.value.trim().toLowerCase();render();});
var rc=document.getElementById("resetConfirm");
document.getElementById("reset").addEventListener("click",function(){rc.hidden=false;});
document.getElementById("resetNo").addEventListener("click",function(){rc.hidden=true;});
document.getElementById("resetYes").addEventListener("click",function(){rc.hidden=true;state.done={};render();persist();});

// Embedded state is the record; if this view can't publish, fall back to this browser's copy.
render();
setStatus("Connecting…");
if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(function(a){
    self=a;
    if(!a){
      try{var l=JSON.parse(localStorage.getItem(LS)||"null");if(l&&l.done&&!Object.keys(state.done).length){state=l;render();}}catch(e){}
      setStatus("Saved in this browser");
    } else setStatus(Object.keys(state.done).length?"Saved":"Tick a mission to start");
  }).catch(function(){setStatus("Saved in this browser");});
} else setStatus("Saved in this browser");
})();
</script>
